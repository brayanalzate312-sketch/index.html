<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizarra de Pronósticos Deportivo</title>
  
  <!-- Carga de React, ReactDOM, Babel y Tailwind CSS desde CDN sin descargas -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body { background-color: #f0f9ff; color: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="p-4 md:p-8">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const TEAMS_DEFAULT = [
      "Alavés", "Athletic Club", "Atlético de Madrid", "Barcelona", "Betis",
      "Celta", "Espanyol", "Getafe", "Girona", "Las Palmas", "Mallorca",
      "Osasuna", "Rayo Vallecano", "Real Madrid", "Real Sociedad", "Sevilla",
      "Valencia", "Villarreal"
    ];

    function n(val) { const x = parseFloat(val); return Number.isFinite(x) ? x : 0; }

    function App() {
      const [teams, setTeams] = useState(TEAMS_DEFAULT);
      const [matches, setMatches] = useState([]);
      const [tab, setTab] = useState("pronostico");

      // Datos para la simulación
      const [fLocal, setFLocal] = useState("Alavés");
      const [fVisit, setFVisit] = useState("Getafe");

      // Cargar y guardar en el navegador
      useEffect(() => {
        const saved = localStorage.getItem("pronosticos_data");
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed.teams) setTeams(parsed.teams);
            if (parsed.matches) setMatches(parsed.matches);
          } catch(e) {}
        }
      }, []);

      const saveMatches = (newMatches) => {
        setMatches(newMatches);
        localStorage.setItem("pronosticos_data", JSON.stringify({ teams, matches: newMatches }));
      };

      // Formulario para ingresar partido manual (Ej: de Flashscore)
      const [form, setForm] = useState({
        home: "Alavés", away: "Getafe",
        homeGoals: 3, awayGoals: 0,
        homeShots: 18, awayShots: 6,
        homeSot: 8, awaySot: 2,
        homeCorners: 5, awayCorners: 3,
        homePoss: 52, awayPoss: 48
      });

      const handleAddMatch = (e) => {
        e.preventDefault();
        if (form.home === form.away) return alert("Selecciona dos equipos distintos.");
        
        const newMatch = { id: Date.now(), ...form };
        const updated = [newMatch, ...matches];
        saveMatches(updated);
        alert("¡Partido guardado con éxito!");
      };

      // Cálculo de promedios cruzados (Local en Casa vs Visitante Fuera)
      const forecast = useMemo(() => {
        const homeMatches = matches.filter(m => m.home === fLocal);
        const awayMatches = matches.filter(m => m.away === fVisit);

        if (!homeMatches.length || !awayMatches.length) return null;

        const avgHomeShots = homeMatches.reduce((acc, m) => acc + n(m.homeShots), 0) / homeMatches.length;
        const avgHomeSot = homeMatches.reduce((acc, m) => acc + n(m.homeSot), 0) / homeMatches.length;
        const avgHomeCorners = homeMatches.reduce((acc, m) => acc + n(m.homeCorners), 0) / homeMatches.length;
        const avgHomePoss = homeMatches.reduce((acc, m) => acc + n(m.homePoss), 0) / homeMatches.length;

        const avgAwayShotsConceded = awayMatches.reduce((acc, m) => acc + n(m.homeShots), 0) / awayMatches.length;
        const avgAwaySotConceded = awayMatches.reduce((acc, m) => acc + n(m.homeSot), 0) / awayMatches.length;
        const avgAwayCornersConceded = awayMatches.reduce((acc, m) => acc + n(m.homeCorners), 0) / awayMatches.length;

        const expShotsLocal = (avgHomeShots + avgAwayShotsConceded) / 2;
        const expSotLocal = (avgHomeSot + avgAwaySotConceded) / 2;
        const expCornersLocal = (avgHomeCorners + avgAwayCornersConceded) / 2;

        return {
          expShotsLocal: expShotsLocal.toFixed(1),
          expSotLocal: expSotLocal.toFixed(1),
          expCornersLocal: expCornersLocal.toFixed(1),
          possLocal: avgHomePoss.toFixed(0),
          homeCount: homeMatches.length,
          awayCount: awayMatches.length
        };
      }, [matches, fLocal, fVisit]);

      return (
        <div class="max-w-4xl mx-auto bg-white p-6 rounded-2xl shadow-xl border border-sky-100">
          <header class="mb-6 border-b border-sky-100 pb-4">
            <h1 class="text-3xl font-bold text-sky-900">⚡ Motor de Pronósticos Deportivos</h1>
            <p class="text-sky-600 text-sm mt-1">Registra estadísticas reales de partidos para simular los próximos enfrentamientos.</p>
          </header>

          <!-- Navegación -->
          <div class="flex gap-4 mb-6 border-b border-sky-100">
            <button onClick={() => setTab("pronostico")} class={`pb-2 font-semibold text-sm ${tab === "pronostico" ? "text-sky-600 border-b-2 border-sky-600" : "text-slate-400"}`}>🎯 Generar Pronóstico</button>
            <button onClick={() => setTab("registrar")} class={`pb-2 font-semibold text-sm ${tab === "registrar" ? "text-sky-600 border-b-2 border-sky-600" : "text-slate-400"}`}>📝 Registrar Partido Manual</button>
          </div>

          {/* TAB 1: PRONÓSTICO */}
          {tab === "pronostico" && (
            <div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                  <label class="block text-xs font-bold text-sky-800 uppercase mb-1">Equipo Local</label>
                  <select value={fLocal} onChange={e => setFLocal(e.target.value)} class="w-full p-2.5 bg-sky-50 border border-sky-200 rounded-lg text-slate-800">
                    {teams.map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-sky-800 uppercase mb-1">Equipo Visitante</label>
                  <select value={fVisit} onChange={e => setFVisit(e.target.value)} class="w-full p-2.5 bg-sky-50 border border-sky-200 rounded-lg text-slate-800">
                    {teams.map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                </div>
              </div>

              {forecast ? (
                <div class="bg-sky-50 border border-sky-200 p-6 rounded-xl space-y-4">
                  <h3 class="font-bold text-lg text-sky-900 border-b border-sky-200 pb-2">Proyección para {fLocal} (Local)</h3>
                  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                    <div class="bg-white p-3 rounded-lg shadow-sm">
                      <div class="text-xs text-slate-500">Remates Totales</div>
                      <div class="text-2xl font-bold text-sky-600">{forecast.expShotsLocal}</div>
                    </div>
                    <div class="bg-white p-3 rounded-lg shadow-sm">
                      <div class="text-xs text-slate-500">Remates a Puerta</div>
                      <div class="text-2xl font-bold text-sky-600">{forecast.expSotLocal}</div>
                    </div>
                    <div class="bg-white p-3 rounded-lg shadow-sm">
                      <div class="text-xs text-slate-500">Córners Estimados</div>
                      <div class="text-2xl font-bold text-sky-600">{forecast.expCornersLocal}</div>
                    </div>
                    <div class="bg-white p-3 rounded-lg shadow-sm">
                      <div class="text-xs text-slate-500">Posesión Estimada</div>
                      <div class="text-2xl font-bold text-sky-600">{forecast.possLocal}%</div>
                    </div>
                  </div>
                </div>
              ) : (
                <div class="p-4 bg-amber-50 text-amber-800 border border-amber-200 rounded-lg text-sm">
                  Aún falta registrar partidos de <b>{fLocal}</b> como local o de <b>{fVisit}</b> como visitante. Ve a la pestaña <b>"Registrar Partido Manual"</b> e ingresa al menos 1 resultado para habilitar el motor.
                </div>
              )}
            </div>
          )}

          {/* TAB 2: REGISTRAR PARTIDO */}
          {tab === "registrar" && (
            <form onSubmit={handleAddMatch} class="space-y-4">
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-bold text-sky-800 uppercase mb-1">Local</label>
                  <select value={form.home} onChange={e => setForm({...form, home: e.target.value})} class="w-full p-2 bg-sky-50 border border-sky-200 rounded-lg">
                    {teams.map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-sky-800 uppercase mb-1">Visitante</label>
                  <select value={form.away} onChange={e => setForm({...form, away: e.target.value})} class="w-full p-2 bg-sky-50 border border-sky-200 rounded-lg">
                    {teams.map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-4 bg-sky-50/50 p-4 rounded-xl border border-sky-100">
                <div>
                  <h4 class="font-bold text-sm text-sky-900 mb-2">Estadísticas {form.home} (Local)</h4>
                  <div class="space-y-2">
                    <input type="number" placeholder="Goles" value={form.homeGoals} onChange={e => setForm({...form, homeGoals: e.target.value})} class="w-full p-2 border rounded" />
                    <input type="number" placeholder="Remates Totales" value={form.homeShots} onChange={e => setForm({...form, homeShots: e.target.value})} class="w-full p-2 border rounded" />
                    <input type="number" placeholder="Remates a Puerta" value={form.homeSot} onChange={e => setForm({...form, homeSot: e.target.value})} class="w-full p-2 border rounded" />
                    <input type="number" placeholder="Córners" value={form.homeCorners} onChange={e => setForm({...form, homeCorners: e.target.value})} class="w-full p-2 border rounded" />
                    <input type="number" placeholder="% Posesión" value={form.homePoss} onChange={e => setForm({...form, homePoss: e.target.value})} class="w-full p-2 border rounded" />
                  </div>
                </div>

                <div>
                  <h4 class="font-bold text-sm text-sky-900 mb-2">Estadísticas {form.away} (Visitante)</h4>
                  <div class="space-y-2">
                    <input type="number" placeholder="Goles" value={form.awayGoals} onChange={e => setForm({...form, awayGoals: e.target.value})} class="w-full p-2 border rounded" />
                    <input type="number" placeholder="Remates Totales" value={form.awayShots} onChange={e => setForm({...form, awayShots: e.target.value})} class="w-full p-2 border rounded" />
                    <input type="number" placeholder="Remates a Puerta" value={form.awaySot} onChange={e => setForm({...form, awaySot: e.target.value})} class="w-full p-2 border rounded" />
                    <input type="number" placeholder="Córners" value={form.awayCorners} onChange={e => setForm({...form, awayCorners: e.target.value})} class="w-full p-2 border rounded" />
                    <input type="number" placeholder="% Posesión" value={form.awayPoss} onChange={e => setForm({...form, awayPoss: e.target.value})} class="w-full p-2 border rounded" />
                  </div>
                </div>
              </div>

              <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl transition-colors">
                💾 Guardar Partido en la Base de Datos
              </button>
            </form>
          )}

          {/* Partidos Guardados */}
          <div class="mt-8 border-t border-sky-100 pt-4">
            <h3 class="text-xs font-bold uppercase text-sky-800 mb-2">Partidos Registrados ({matches.length})</h3>
            <div class="space-y-2 max-h-40 overflow-y-auto">
              {matches.map((m, i) => (
                <div key={i} class="text-xs bg-slate-50 p-2 rounded flex justify-between text-slate-600 border border-slate-200">
                  <span><b>{m.home}</b> {m.homeGoals} - {m.awayGoals} <b>{m.away}</b></span>
                  <span>Remates: {m.homeShots}-{m.awayShots} | Córners: {m.homeCorners}-{m.awayCorners}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
